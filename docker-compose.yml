version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: crunchy_db
    environment:
      POSTGRES_DB: crunchy_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      # Permanent data storage
      - postgres_data:/var/lib/postgresql/data
      # Backup directory (host machine pe)
      - ./postgres_backup:/backup
    ports:
      # Standard PostgreSQL port - external access ke liye
      - "0.0.0.0:5432:5432"
    networks:
      - crunchy_network
    # Auto-restart on server reboot
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      postgres
      -c listen_addresses='*'
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c wal_level=replica
      -c max_wal_size=2GB

volumes:
  postgres_data:
    driver: local

networks:
  crunchy_network:
    driver: bridge

